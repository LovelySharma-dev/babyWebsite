<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Pip's Midnight Nursery</title>
  <desc id="desc">An animated moon, cloud, and stars introduce Pip's interactive dream engineering portfolio.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#2d2350"/>
      <stop offset="1" stop-color="#6c5478"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#sky)"/>
  <circle cx="1000" cy="78" r="54" fill="#e9bc62" opacity=".24" filter="url(#glow)"/>
  <circle cx="1000" cy="78" r="38" fill="#e9bc62"/>
  <g fill="#e9bc62" font-family="Georgia,serif" font-size="24">
    <text x="180" y="62">✦</text><text x="270" y="188">✧</text><text x="820" y="48">✦</text>
  </g>
  <g fill="#c9b9d7" opacity=".9">
    <ellipse cx="116" cy="220" rx="115" ry="25"/><ellipse cx="1028" cy="220" rx="185" ry="28"/>
  </g>
  <g font-family="Georgia,serif" fill="#f7f0df">
    <text x="62" y="110" font-size="54" font-weight="bold">Pip builds the</text>
    <text x="62" y="168" font-size="58" font-style="italic" fill="#e5a1a1">dreams</text>
    <text x="62" y="208" font-family="monospace" font-size="13" letter-spacing="2">JUNIOR DREAM ENGINEER · MIDNIGHT NURSERY</text>
  </g>
  <g transform="translate(920 110)">
    <animateTransform attributeName="transform" type="translate" values="920 110;920 98;920 110" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="70" rx="84" ry="16" fill="#211a3b" opacity=".35"/>
    <circle cx="0" cy="10" r="54" fill="#e5a1a1" stroke="#271d43" stroke-width="4"/>
    <path d="M-48 -15 Q0 -76 47 -24 L34 8 L-35 8Z" fill="#2d2350"/>
    <circle cx="-18" cy="11" r="5" fill="#f7f0df"/><circle cx="18" cy="11" r="5" fill="#f7f0df"/>
    <path d="M-10 34 Q0 42 10 34" fill="none" stroke="#271d43" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
